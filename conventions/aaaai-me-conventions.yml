authentication:
  style: header api key or session cookie
  detail: >-
    Swagger securityDefinitions.ApiKeyAuth = apiKey in header "X-User-Login"; the live 401 says
    "Please login or provide X-User-Login header". Browser clients get a "session" cookie (HttpOnly,
    SameSite=Lax, 30-day expiry) from POST /api/auth/login; Sign in with Apple via POST /api/auth/apple.
    Agents creating exec approvals send an "X-Agent-Token" header (named in the summary of
    POST /api/approvals). auth.md says programmatic clients "should use API keys configured in the
    product (Settings -> API keys) or OAuth tokens where supported"; the OAuth metadata is published
    but its issuer host serves no discovery document (scopes/). No operation in the contract applies
    a security requirement, so which routes are anonymous is only knowable by probing: /api/health,
    /api/billing/crypto/config, /api/billing/yookassa/config and /api/mcp/marketplace answered 200
    without credentials; /api/status answered 401.
