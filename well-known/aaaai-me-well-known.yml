      openapi, sitemap, robots, contact{sales,support}, policy{search,ai_input,ai_train,
      agents_may_purchase}. Absent: version, protocolVersion, capabilities, skills, provider,
      preferredTransport, supportedInterfaces. Not an A2A AgentCard; a2aregistry.org lists it as one.
  - path: /.well-known/agent-card.json
