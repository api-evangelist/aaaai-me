source: >-
  Live GET probes of the named /.well-known/* and root discovery paths on aaaai.me, www.aaaai.me,
  web.aaaai.me and docs.aaaai.me, 2026-09-19. Every row below is a request that was actually issued
  and every status is the one returned. Saved files are byte-for-byte copies of the served bodies.
summary:
  hosts_probed: 4
  documents_served: 9
  hit_count: 9
  path_echo_control: passed
  note: >-
    AAA AI publishes an unusually complete DISCOVERY layer on its static marketing host aaaai.me
    (S3 + CloudFront): an RFC 9727 API catalog, OAuth 2.0 authorization-server metadata (RFC 8414),
    OpenID Provider metadata, RFC 9728 protected-resource metadata, an OpenAI-era ai-plugin.json, an
    agentskills.io discovery index, an MCP "server card", an agent-payments catalog and a
    /.well-known/agent.json. Only some of what those documents POINT AT exists on the API host
    web.aaaai.me: the OpenAPI they name (https://web.aaaai.me/apispec_1.json) is a 404 and the real
    Swagger 2.0 document lives at https://web.aaaai.me/api/spec.json (the URL the Flasgger UI at
    /apidocs loads); the MCP transport URL (https://web.aaaai.me/api/mcp/marketplace) is a GET-only
    JSON catalog of third-party stdio MCP servers, not an MCP endpoint (POST tools/list returns 405);
    the api-catalog's MCP anchor https://web.aaaai.me/api/mcp is a 404; and the jwks_uri the OIDC
    document declares (https://web.aaaai.me/.well-known/jwks.json) is a 404. The /.well-known/agent.json
    is a site-map style manifest (name, description, url, homepage, docs, pricing, contact, policy
    and links to the other files) and carries none of version, protocolVersion, capabilities or
    skills — it fails the AgentCard shape test (2 of 6 identifying fields), so it is recorded HERE as a
    served well-known document and NOT as an A2A agent card (no a2a/ artifact, no AgentCard pointer).
    aaaai.me answers every missing key with an S3 AccessDenied 403 (111-byte XML), which is this host's
    404; a negative-control path that cannot exist returned that same 403, and web.aaaai.me returned
    its real JSON 404 for its control, so none of the 200s below is a catch-all.
hosts:
