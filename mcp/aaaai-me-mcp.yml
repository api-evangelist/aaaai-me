summary: >-
  AAA AI publishes an MCP "server card" at https://aaaai.me/.well-known/mcp/server-card.json
  (serverInfo "AAA AI Platform" 2026.09; capabilities tools/resources/prompts true; "122 integrations",
  "682 catalog_actions"; authentication oauth2 pointing at the RFC 8414/9728 documents on aaaai.me) whose
  transport is declared as {type: sse, url: https://web.aaaai.me/api/mcp/marketplace}. Probed
  2026-09-19, that URL is NOT an MCP endpoint: a GET returns HTTP 200 application/json with a "catalog"
  of 17 third-party stdio MCP servers the platform lets a user enable (filesystem, fetch, git, time,
  memory, brave-search, mcp-docs, sequential-thinking, slack, github, postgres, sqlite, google-maps,
  puppeteer, google-drive, notion, redis — each an npx/uvx command from @modelcontextprotocol,
  @brave or @notionhq), and a POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"} with Accept
  application/json, text/event-stream returns HTTP 405 Method Not Allowed. The api-catalog's MCP anchor
  https://web.aaaai.me/api/mcp is a 404 (GET and POST). No SSE stream, no initialize, no tools/list.
  AAA AI is therefore an MCP HOST/CLIENT (its workspace and workflow "MCP Tool" node consume MCP
  servers) and publishes no MCP server of its own that an agent can connect to. The Swagger contract
  exposes the marketplace configuration through GET/PUT /api/settings/mcp-platforms.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: probed
  note: >-
    mode is none because nothing answers MCP JSON-RPC: the declared SSE URL is a GET-only catalog
    (POST -> 405) and the api-catalog anchor is a 404. The server card's oauth2 block references real
    discovery documents on aaaai.me, but with no server to authorize against auth is recorded as
    unknown rather than oauth. If AAA AI ships an endpoint at either URL this record should be
    re-probed; do not treat the server card alone as a reachable agent surface.
