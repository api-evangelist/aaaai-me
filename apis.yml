apis:
- aid: aaaai-me:aaaai-agent-checkout-api
  name: AAA AI Agent Checkout (Billing) API
  description: >-
    The provider-documented purchase surface for autonomous agents, described in https://aaaai.me/pay.md
    and machine-readably in https://aaaai.me/.well-known/agent-payments.json but absent from the Swagger
    contract: GET /api/billing/crypto/config (anonymous; probed 200 — USDT 20.0, ETH 0.006, BTC 0.0003),
    POST /api/billing/crypto/create {email, currency} returning address, amount, currency and status_token,
    and GET /api/billing/crypto/status/{address}?status_token= polled until confirmed, at which point
    the $20/month Pro licence is applied to that email. Sibling Paddle card checkout (browser-assisted)
    and YooKassa SBP endpoints (config reports enabled: false) are documented alongside. The provider's
    policy states AI agents may purchase Pro when a user needs paid access; refunds are discretionary
    under the Terms.
  humanURL: https://aaaai.me/pay.md
  baseURL: https://web.aaaai.me/api/billing
  tags:
  - Agentic Commerce
  - Payments
  - Crypto
  - Subscription
  tags_raw:
  - Agent Commerce
  - Payments
  - Crypto
  - Subscriptions
