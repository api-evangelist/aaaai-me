    operations, so each candidate is named from method + path and points at the path. This is a
    proposal, not a published server; nothing here is callable over MCP today. The operations chosen
    are the agent-facing ones: query/streaming, approvals, scheduled jobs, background goals, the
    Deep Agent and single-tool invocation.
