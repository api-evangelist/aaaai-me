aid: aaaai-me
name: AAA AI
description: >-
  AAA AI (Autonomous Agents Automations; product spelling AAAAI) is a Montenegro-based multi-agent AI
  platform operated by Kirill Pokidov: a workspace at web.aaaai.me that routes questions through a
  panel of expert models with debate and verification modes, runs visual workflows with human-approval
  nodes across a catalog of integrations, pairs desktop "agents" on a user's own machines, and adds
  Meet — voice and video calls with live AI notes. Sold as a $20/month Pro cloud plan (card, crypto or
  SBP) or self-hosted. The API is a 102-operation Swagger 2.0 contract on web.aaaai.me (chat, streaming
  queries, an OpenAI-compatible /v1/chat/completions, approvals, cron jobs, goal jobs, experts,
  settings) authenticated by an X-User-Login header, plus a documented crypto checkout API that lets
  an agent buy the subscription autonomously. The static site aaaai.me publishes an unusually complete
  agent-discovery layer — RFC 9727 api-catalog, OAuth/OIDC/RFC 9728 metadata, ai-plugin.json, an MCP
  server card, an agentskills.io index, agent-payments.json, llms.txt and the full ai-visibility.org.uk
  file set — several of whose targets (the named OpenAPI URL, the MCP endpoint, the JWKS) do not exist.
