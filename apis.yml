apis:
- aid: aaaai-me:aaaai-platform-api
  name: AAAAI Platform API
  description: >-
    REST API of the AAA AI workspace, published as Swagger 2.0 "AAAAI API" 1.1.0 (host web.aaaai.me,
    79 paths, 102 operations, no operationIds, empty definitions) at https://web.aaaai.me/api/spec.json —
    the document the Flasgger UI at /apidocs loads; every provider discovery file instead names
    /apispec_1.json, which is a 404. Covers health, auth (login, register, Sign in with Apple, delete
    account), the current user, chats with messages and attachments, one-shot and SSE-streamed
    queries, OpenAI-compatible /v1/models and /v1/chat/completions, code-only generation, audio
    transcription and speech, expert-pool and dynamic-expert management, cognitive scaling, exec
    approvals (X-Agent-Token), cron jobs, background goal jobs, the Deep Agent, single-tool invocation
    on paired device agents, dev-preview sessions, connected nodes, video sessions, memories and
    per-user settings including MCP platform profiles. Auth is an X-User-Login header or session
    cookie; /api/health answers anonymously.
  humanURL: https://web.aaaai.me/apidocs
  baseURL: https://web.aaaai.me
